    - name: Setup NDK & Git Config
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r28

    - name: Configure Git Credentials
      run: |
        git config --global url."https://${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

    - name: Build release
      run: |
        chmod 777 ./build.sh
        ./build.sh release
